[pytest]
testpaths = tests
addopts = -ra --tb=short

# Data-contract checks (tests/test_contract.py).
# Freshness is measured at this time. The synthetic data ends on business date
# 2026-10-27, so it is pinned to the 07:00 refresh deadline the morning after;
# clear it to measure against the current time when testing a live feed.
# Override with --validation-time.
validation_time = 2026-10-28T07:00
# Git ref holding the contract version currently in force. Contract edits are
# checked against it under the breaking-change policy. Override with
# --contract-baseline-ref.
contract_baseline_ref = origin/main
